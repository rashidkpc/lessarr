# lessarr configuration.
#
# Unknown keys are rejected, so a typo fails loudly instead of silently
# falling back to a default.

[server]
listen      = "0.0.0.0:8585"
db          = "/config/lessarr.db"
log_level   = "info"
# Protect the dashboard and API with HTTP Basic Auth. Set both or neither.
# username    = "admin"
# password    = "change-me"
# Optional JSON webhook for job failures.
# webhook_url = "https://example.invalid/lessarr"

[encoder]
backend   = "auto"        # auto | vaapi | qsv | software
device    = "/dev/dri/renderD128"
workers   = 1             # keep at 1 on a low-power host
nice      = 15
decide_by = "heuristic"   # sample-based measurement lands in M1

[audio]
keep_languages         = ["eng"]
keep_default_track     = true
keep_original_language = true
lossless_to_eac3       = true
eac3_bitrate_51        = "640k"
eac3_bitrate_20        = "256k"

[subtitles]
keep_languages = ["eng", "fre"]
keep_forced    = true

[trash]
# Keep only the newest original per file, and bound the rest.
retention   = "48h"
max_size_gb = 20

[comparisons]
# Generated before/after galleries are also bounded.
retention   = "720h"
max_size_gb = 2

[[library]]
name                = "Movies"
path                = "/media/movies"
# write gates the only step that modifies a file, and it is off unless the word
# is typed. A library with write = false is still probed, decided and recorded,
# so stats and the dashboard show exactly what would have happened.
write               = false
mode                = "transcode"

# 0 preserves source resolution. Set 1920 to cap everything at 1080p class.
max_long_edge       = 0
min_long_edge       = 480

icq                 = 24
preset              = "slow"
validation          = "sample" # sample | full; full decodes every frame

min_savings_percent = 25
min_remux_bytes     = 100     # MB; remuxing is nearly free, so this bar is absolute
min_duration        = "3m"    # the real sample filter
min_size_mb         = 50      # too small to be worth GPU time
skip_if_newer_than  = "10m"   # let Sonarr/Radarr finish importing

hdr                 = "skip"  # never transcode HDR10/DoVi/HLG
allow_10bit         = false   # never re-encode 10-bit HEVC (8-bit output only)
free_space_factor   = 1.15

ignore = ["*sample*", "*.partial", "*.!qB", "*.tmp", "*/Extras/*"]

[[library]]
name                = "TV"
path                = "/media/tv"
write               = false
mode                = "transcode"
max_long_edge       = 0
hdr                 = "skip"
allow_10bit         = false
ignore              = ["*sample*", "*.partial", "*.!qB", "*.tmp"]
