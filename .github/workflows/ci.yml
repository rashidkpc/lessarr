name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pin to a known runner image rather than the moving ubuntu-latest alias.
    # GitHub is migrating that alias to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ffprobe is needed by the tests that shell out to it. The hardware code
      # paths are covered by golden argv tests, which need no GPU and no ffmpeg.
      - name: install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # Explicit, because `go test ./...` passes happily when the main package
      # is missing entirely. This is what catches a .gitignore pattern that
      # swallows a source directory.
      - name: build
        run: go build ./cmd/lessarr

      - name: test
        run: go test -count=1 ./...

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=edge
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build bookworm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bookworm
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:edge-bookworm
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-bookworm
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bookworm
          cache-to: type=gha,mode=max,scope=bookworm

# NOTE: the first publish creates the GHCR package PRIVATE. It must be flipped
# to public in the package settings, or Docker client cannot pull it. See
