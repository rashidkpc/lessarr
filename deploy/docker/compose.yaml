name: lessarr

services:
  lessarr:
    image: ${LESSARR_IMAGE:-ghcr.io/rashidkpc/lessarr:edge-bookworm}
    container_name: lessarr
    # systemd owns the lifecycle so it can start after the media mount.
    restart: "no"
    init: true
    # Use host networking when bridge networking is unavailable on the Docker host.
    network_mode: host
    devices:
      - ${LESSARR_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128
    volumes:
      - ${LESSARR_CONFIG:?set LESSARR_CONFIG in .env}:/config/config.toml:ro
      - ${LESSARR_STATE:?set LESSARR_STATE in .env}:/state
      - ${LESSARR_MEDIA:?set LESSARR_MEDIA in .env}:/media
    environment:
      TZ: ${TZ:-UTC}
    command: ["run", "--config", "/config/config.toml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8585/readyz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 2m
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
