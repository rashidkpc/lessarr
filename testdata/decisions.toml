# Decision table.
#
# Each case is a synthetic file description, not real media: the engine only
# consumes probe facts, so hand-written cases let us cover codecs we cannot
# synthesize (VC-1, DTS-HD MA, TrueHD, PGS) and keep the test hermetic.
#
# Sizes are consistent with bitrate x duration so that the projected-savings
# arithmetic stays honest.

